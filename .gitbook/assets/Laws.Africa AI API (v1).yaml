openapi: 3.0.3
info:
  title: Laws.Africa Content API
  version: 20.0.0 (v1)
  description: Read-only Content API
paths:
  /ai/v1/knowledge-bases:
    get:
      operationId: knowledge_bases_list
      description: |-
        Get details of Laws.Africa's Knowledge Bases.

        Note: this API is a preview and may change in future.
      summary: Explore legal data Knowledge Bases for use with Generative AI (PREVIEW).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - knowledge-bases
      security:
      - cookieAuth: []
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKnowledgeBaseList'
          description: ''
  /ai/v1/knowledge-bases/{code}:
    get:
      operationId: knowledge_bases_retrieve
      description: |-
        Get details of Laws.Africa's Knowledge Bases.

        Note: this API is a preview and may change in future.
      summary: Explore legal data Knowledge Bases for use with Generative AI (PREVIEW).
      parameters:
      - in: path
        name: code
        schema:
          type: string
          description: Unique code identifying this knowledge base
        required: true
      tags:
      - knowledge-bases
      security:
      - cookieAuth: []
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
          description: ''
  /ai/v1/knowledge-bases/{code}/retrieve:
    post:
      operationId: knowledge_bases_retrieve_create
      description: Retrieve items from the knowledge base that match your query.
      summary: Query the knowledge base for matching items.
      parameters:
      - in: path
        name: code
        schema:
          type: string
          description: Unique code identifying this knowledge base
        required: true
      tags:
      - knowledge-bases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseRetrieveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseRetrieveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseRetrieveRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseRetrieveResponse'
          description: ''
  /ai/v1/schema:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - fr
      tags:
      - schema
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    KnowledgeBase:
      type: object
      properties:
        code:
          type: string
          description: Unique code identifying this knowledge base
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: Name of the knowledge base
          maxLength: 255
        description:
          type: string
          description: Description of the knowledge base
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - code
      - description
      - name
      - url
    KnowledgeBaseItem:
      type: object
      description: A knowledge base item.
      properties:
        content:
          $ref: '#/components/schemas/KnowledgeBaseItemContent'
        metadata:
          $ref: '#/components/schemas/KnowledgeBaseItemMetadata'
        score:
          type: number
          format: double
          minimum: 0
          description: The similarity score of the item (higher is better)
      required:
      - content
      - metadata
      - score
    KnowledgeBaseItemContent:
      type: object
      description: The content of a knowledge base item.
      properties:
        text:
          type: string
          description: The text content of the item
      required:
      - text
    KnowledgeBaseItemMetadata:
      type: object
      description: Metadata about a knowledge base item.
      properties:
        work_frbr_uri:
          type: string
          description: Work FRBR URI for the work the item belongs to
        frbr_place:
          type: string
          description: FRBR place code
        frbr_country:
          type: string
          description: FRBR country code
        frbr_doctype:
          type: string
          description: FRBR document type
        frbr_subtype:
          type: string
          description: FRBR document subtype
        title:
          type: string
          description: Title of the document the item belongs to
        repealed:
          type: boolean
          description: Is the work repealed? Legislation only.
        commenced:
          type: boolean
          description: Is the work commenced? Legislation only.
        principal:
          type: boolean
          description: Is the work a principal work? Legislation only.
        blurb:
          type: string
          description: A short one-sentence summary of the document (Judgments only).
        flynote:
          type: string
          description: A flynote (key phrases) for the document (Judgments only).
        expression_date:
          type: string
          format: date
          description: Expression date of the document
        expression_frbr_uri:
          type: string
          description: Expression FRBR URI for the document the item belongs to
        public_url:
          type: string
          description: Public URL to access the document
        portion_type:
          allOf:
          - $ref: '#/components/schemas/PortionTypeEnum'
          description: |-
            Type of the portion

            * `page` - page
            * `provision` - provision
            * `text` - text
            * `summary` - summary
        portion_id:
          type: string
          description: Identifier of the portion. A page number when type=page, an
            eid when type=portion.
        portion_title:
          type: string
          description: Title of the portion
        portion_parent_ids:
          type: array
          items:
            type: string
          description: List of parent portion IDs, from top downwards
        portion_parent_titles:
          type: array
          items:
            type: string
          description: List of parent portion titles, from top downwards
        portion_public_url:
          type: string
          description: Public URL to access the portion
      required:
      - expression_date
      - expression_frbr_uri
      - frbr_country
      - frbr_doctype
      - frbr_place
      - frbr_subtype
      - portion_type
      - public_url
      - title
      - work_frbr_uri
    KnowledgeBaseRetrieveRequest:
      type: object
      description: Details to retrieve items from a knowledge base.
      properties:
        text:
          type: string
          description: The text to find matching items for
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          description: Number of results to return
        filters:
          properties:
            work_frbr_uri:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Work Frbr Uri
            work_frbr_uri__in:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              title: Work Frbr Uri  In
            expression_frbr_uri:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Expression Frbr Uri
            expression_frbr_uri__in:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              title: Expression Frbr Uri  In
            frbr_place:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Frbr Place
            frbr_place__in:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              title: Frbr Place  In
            frbr_doctype:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Frbr Doctype
            frbr_doctype__in:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              title: Frbr Doctype  In
            frbr_subtype:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Frbr Subtype
            frbr_subtype__in:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              title: Frbr Subtype  In
            repealed:
              anyOf:
              - type: boolean
              - type: 'null'
              default: null
              title: Repealed
            commenced:
              anyOf:
              - type: boolean
              - type: 'null'
              default: null
              title: Commenced
            principal:
              anyOf:
              - type: boolean
              - type: 'null'
              default: null
              title: Principal
          title: KnowledgeBaseFilters
          type: object
      required:
      - text
    KnowledgeBaseRetrieveResponse:
      type: object
      description: Items retrieved from a knowledge base.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBaseItem'
      required:
      - results
    PaginatedKnowledgeBaseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBase'
    PortionTypeEnum:
      enum:
      - page
      - provision
      - text
      - summary
      type: string
      description: |-
        * `page` - page
        * `provision` - provision
        * `text` - text
        * `summary` - summary
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: http
      scheme: bearer
